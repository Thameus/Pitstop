name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Build release archives
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Check tag and Linux xz support
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} differs from Directory.Build.props version v$v"
          }
          $t = & "$env:SystemRoot\System32\tar.exe" --version
          Write-Host $t
          if ($t -notmatch 'liblzma') { throw 'tar.exe on this runner has no xz/liblzma support' }

      - name: Package Windows and Linux
        shell: powershell
        run: .\scripts\release\empacotar.ps1

      - name: Smoke release archives
        shell: pwsh
        run: ./tests/smoke-package.ps1

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pitstop-release
          path: |
            dist/*.exe
            dist/*.run
            dist/*.zip
            dist/*.tar.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    name: Run packaged Linux binary
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pitstop-release
          path: dist

      - name: Smoke Linux self-contained package
        run: sh ./tests/smoke-package-linux.sh dist

  publish:
    name: Publish GitHub Release
    needs: [package, smoke-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pitstop-release
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(cat <<'EOF'
          Instaladores do Pitstop para Windows e Linux x64.

          - Windows: baixe pitstop-*-setup-win-x64.exe e siga o assistente.
          - Linux: baixe pitstop-*-linux-x64.run e execute com sh <arquivo>.run.
          - Portateis: Windows em .zip; Linux em .tar.xz.
          - Integridade: confira SHA256SUMS.txt.
          - Perfis: Tomcat, Java, pacotes, npm e Comando personalizado.
          - O instalador pode preparar JDK, Tomcat, Maven e Node.js de forma opcional.
          - Windows: esta versao ainda nao possui assinatura Authenticode; o SmartScreen pode exibir um aviso.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe dist/*.run dist/*.zip dist/*.tar.xz dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "Pitstop $TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/*.exe dist/*.run dist/*.zip dist/*.tar.xz dist/SHA256SUMS.txt --title "Pitstop $TAG" --notes "$notes"
          fi
