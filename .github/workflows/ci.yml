name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build + smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Build
        run: dotnet build src/Pitstop.slnx -c Release --nologo

      - name: Validate shell scripts
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/release/pitstop-linux.run.sh
          sh -n scripts/install/instalar.sh
          sh -n scripts/install/desinstalar.sh
          sh -n instalar.sh
          sh -n pit
          sh -n tests/smoke-package-linux.sh

      - name: Smoke
        shell: pwsh
        run: ./tests/smoke.ps1
